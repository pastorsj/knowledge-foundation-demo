[project]
name = "demo-data"
version = "0.1.0"
description = "Validates data packs and builds them into the runtime layout under /data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # The writer must not be newer than the DuckDB readers (api, market-analytics, Auto Ontology);
  # tests/test_duckdb_versions.py checks this against their uv.lock files.
  "duckdb==1.5.5",
  "fsspec==2026.9.0", # data fetch: every source is an fsspec URL (local paths need no extra)
  "jsonschema==4.26.0",
  "lxml==6.1.3",
  "numpy==2.5.3", # the synthetic-market generator's seeded streams
  "pyarrow==25.0.1",
  "pytz==2026.4", # DuckDB needs it to return TIMESTAMP WITH TIME ZONE values to Python
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
# The remote sources of `demo-data fetch`: https, s3, gs and hf. The image installs them.
remote = ["aiohttp==3.14.3", "gcsfs==2026.8.1", "huggingface-hub==2.0.0", "s3fs==2026.9.0"]

[project.scripts]
demo-data = "demo_data.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["uv_build>=0.11.28,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not slow and not live"]
markers = [
  "slow: builds a real pack profile end to end",
  "live: fetches public sources over the network",
]
