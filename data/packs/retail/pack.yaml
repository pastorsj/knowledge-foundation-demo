#
# Lumen Retail Group, a fictional omnichannel home-and-lifestyle retailer. Everything under files/ is synthetic and is
# written by generator/build.py (seeded, deterministic). The documents source holds policies and procedures (two PDFs,
# a DOCX and a scanned memo that only an OCR/VLM parser can read); the reports source holds a PPTX review and a PDF with
# tables whose figures agree with the structured source. See README.md for the data card and the answer key.
schema_version: "3"
id: retail
version: "1.0.0"
title: Retail
description: >-
  Lumen Retail Group, a fictional omnichannel home-and-lifestyle retailer with 24 stores in four US regions plus
  Lumen.com: stores, products, customers, orders and returns for April 2025 to September 2026 beside its return policy,
  store operations SOP, supplier terms, a scanned loss-prevention memo and its Q3 2026 performance reports.
icon: Store
as_of: "2026-09-30"
disclaimer: >-
  Synthetic data for a software demonstration: Lumen Retail Group and every store, product, customer, supplier, document
  and figure are fictional, and any resemblance to a real company or person is coincidental.

licenses:
  - name: Apache-2.0
    path: https://www.apache.org/licenses/LICENSE-2.0
    redistribution: allowed
    notes: The tables and documents are synthetic demonstration assets generated by generator/build.py.

provenance:
  - id: retail-generator
    title: Lumen Retail Group tables and documents (seeded generator)
    kind: generated
    synthetic: true
    license: Apache-2.0
    as_of: "2026-09-30"
    notes: >-
      generator/build.py (seed 1148) writes the CSV and XLSX tables with numpy, and renders the PDF, DOCX, PPTX and scanned
      PNG documents from generator/content/. Every figure in a document is computed from the generated tables.

sources:
  - id: policies
    name: Policies & Procedures
    description: Return and refund policy, store operations SOP, supplier terms and a scanned loss-prevention memo.
    agent_description: >-
      Lumen Retail Group's policies and procedures: the return and refund policy (return windows and the restocking fee
      table by category), the store operations SOP (hours, cash handling, returns at the till, inventory control), the
      fiscal 2026 supplier terms (payment terms, rebates, defect allowances) and an Asset Protection memo on no-receipt
      return limits and the stores on enhanced return monitoring. The memo is a scanned image. Use it for policy,
      procedure and contract questions; the numbers behind them live in the sales tables.
    kind: documents
    files:
      - files/policies/*.pdf
      - files/policies/*.docx
      - files/policies/*.png
    capabilities: [unstructured_retrieval]
    synthetic: true
    default_enabled: true
    example_questions:
      - What restocking fee applies to returned furniture?
      - What is the no-receipt return limit in the loss-prevention memo?
      - Which suppliers get Net 60 payment terms?

  - id: reports
    name: Merchandising & Performance Reports
    description: The Q3 2026 merchandising review deck and the Q3 2026 regional performance report.
    agent_description: >-
      Lumen Retail Group's quarterly reporting for Q3 2026 (July 1 to September 30): the merchandising review deck
      (category results against plan, promotions, returns, suppliers, the Q4 plan) and the regional performance report
      (net sales, orders, returns and store results by region, with tables). The figures are computed from the sales
      tables, which hold the underlying orders and returns.
    kind: documents
    files:
      - files/reports/*.pdf
      - files/reports/*.pptx
    capabilities: [unstructured_retrieval]
    synthetic: true
    default_enabled: true
    example_questions:
      - Which region grew net sales fastest in Q3 2026?
      - Which categories missed their Q3 plan, according to the merchandising review?

  - id: sales
    name: Sales & Customers
    description: Stores, products, customers, orders, order items and returns, plus the merchandising plan workbook.
    agent_description: >-
      Lumen Retail Group's operational tables in DuckDB (alias retail_sales). stores: 24 physical stores (store_id S01 to
      S24; region Northeast, Southeast, Midwest or West) and the online store WEB (region E-commerce). products: the range
      with category, supplier and list price. customers: loyalty members with tier (bronze, silver, gold). orders,
      order_items and returns: April 2025 to September 2026, a loyalty-member sample; returns carry condition (opened,
      unopened, defective) and returned_amount. merchandising_plan_category_targets (quarterly net sales targets by
      category) and merchandising_plan_promo_calendar come from the planning workbook. Net sales is SUM(orders.net_amount);
      quarters are calendar quarters.
    kind: structured
    files:
      - files/sales/*.csv
      - files/sales/*.xlsx
    capabilities: [structured_retrieval, structured_prediction]
    synthetic: true
    default_enabled: true
    example_questions:
      - Which five physical stores had the highest net sales in Q3 2026?
      - Which product category had the highest return rate in Q3 2026?
      - Which gold-tier customers are most likely to place no order in the next 90 days?
    tables:
      stores:
        description: One row per store, covering the 24 physical stores and the online store WEB.
        primary_key: store_id
        columns:
          store_id: Store identifier; S01 to S24 for physical stores, WEB for Lumen.com.
          store_name: Store name.
          store_type: Format - flagship, mall, standalone, outlet or ecommerce.
          region: Sales region - Northeast, Southeast, Midwest, West or E-commerce.
          state: Two-letter US state; empty for the online store.
          city: City; empty for the online store.
          opened_on: Date the store opened.
          square_feet: Selling area in square feet; empty for the online store.
      products:
        description: One row per product (SKU) in the range, with its category, supplier and price.
        primary_key: product_id
        columns:
          product_id: Product identifier.
          sku: Stock keeping unit code.
          product_name: Product name, including brand and variant.
          category: Merchandise category - Electronics, Furniture, Home Decor, Kitchen & Dining, Bedding & Bath, Apparel or Outdoor & Garden.
          subcategory: Product line within the category.
          brand: Brand; Lumen Living is the private label.
          supplier: Supplier name, as in the supplier terms document.
          list_price: Shelf price in USD.
          unit_cost: Cost to Lumen per unit in USD.
      customers:
        description: One row per Lumen Rewards loyalty member.
        primary_key: customer_id
        time_column: joined_at
        foreign_keys:
          - column: home_store_id
            references: stores.store_id
        columns:
          customer_id: Customer identifier.
          tier: Current loyalty tier - bronze, silver or gold.
          joined_at: Date the customer joined the loyalty program.
          home_store_id: The store the customer shops at most; WEB for online-first customers.
          age_band: Age band of the customer.
          email_opt_in: Whether the customer accepts marketing email.
      orders:
        description: One row per order placed by a loyalty member, in stores or on Lumen.com, from April 2025 to September 2026.
        primary_key: order_id
        time_column: ordered_at
        foreign_keys:
          - column: customer_id
            references: customers.customer_id
          - column: store_id
            references: stores.store_id
          - column: promo_id
            references: merchandising_plan_promo_calendar.promo_id
        columns:
          order_id: Order identifier.
          customer_id: The customer who placed the order.
          store_id: The store that took the order; WEB for online orders.
          ordered_at: Order timestamp.
          channel: in_store or online.
          promo_id: Promotion applied to the order; empty when none.
          item_count: Number of units on the order.
          gross_amount: Order value at list price, in USD.
          discount_amount: Total discount in USD.
          net_amount: Order value after discounts, in USD; the basis of net sales.
      order_items:
        description: One row per product line on an order.
        primary_key: order_item_id
        foreign_keys:
          - column: order_id
            references: orders.order_id
          - column: product_id
            references: products.product_id
        columns:
          order_item_id: Order line identifier.
          order_id: The order this line belongs to.
          product_id: The product sold.
          quantity: Units sold on the line.
          unit_price: List price per unit in USD.
          discount_amount: Discount on the line in USD.
          line_amount: Line value after discounts, in USD.
      returns:
        description: One row per return of an order line (a whole line or part of it), April 2025 to September 2026.
        primary_key: return_id
        time_column: returned_at
        foreign_keys:
          - column: order_item_id
            references: order_items.order_item_id
          - column: order_id
            references: orders.order_id
          - column: customer_id
            references: customers.customer_id
          - column: product_id
            references: products.product_id
          - column: store_id
            references: stores.store_id
        columns:
          return_id: Return identifier.
          order_item_id: The order line that was returned.
          order_id: The order the line belongs to.
          customer_id: The customer who returned the item.
          product_id: The product returned.
          store_id: The store that processed the return; WEB for mail returns.
          returned_at: Return timestamp.
          quantity: Units returned.
          returned_amount: Value of the returned units before any restocking fee, in USD.
          condition: Condition at return - opened, unopened or defective; the restocking fee depends on it.
          reason: Return reason given by the customer.
      merchandising_plan_category_targets:
        description: The merchandising plan's net sales, margin and unit targets by category and quarter (workbook sheet category_targets), 2025-Q2 to 2026-Q4.
        primary_key: target_id
        time_column: quarter_start
        columns:
          target_id: Target identifier.
          quarter: Fiscal quarter, as YYYY-Qn (fiscal quarters are calendar quarters).
          quarter_start: First day of the quarter.
          category: Merchandise category, as products.category.
          target_net_sales: Net sales target in USD.
          target_gross_margin_pct: Gross margin target as a fraction of net sales.
          target_units: Unit target.
          plan_status: Locked for past and current quarters, Draft for the next.
      merchandising_plan_promo_calendar:
        description: The promotion calendar (workbook sheet promo_calendar) with each event's dates, scope, discount depth and budget.
        primary_key: promo_id
        time_column: start_date
        columns:
          promo_id: Promotion identifier; orders.promo_id refers to it.
          promo_name: Name of the promotion.
          start_date: First day of the promotion.
          end_date: Last day of the promotion.
          category: Category the discount applies to, or All categories.
          channel: All, Online or In-store.
          discount_pct: Discount as a fraction of price.
          budget_usd: Promotion budget in USD.
          status: Completed, Active or Planned at 2026-09-30.
    prediction:
      templates:
        - id: churn_90d
          name: Customer churn (no order in 90 days)
          description: >-
            Likelihood that a loyalty customer places no order in the next 90 days. Kumo scores at most 1,000 entities per
            request and there are 1,500 customers, so filter after FOR EACH, for example WHERE customers.tier = 'gold'.
          pql: PREDICT COUNT(orders.*, 0, 90, days) = 0 FOR EACH customers.customer_id
          anchor_time: "2026-10-01T00:00:00Z"
        - id: return_risk_30d
          name: Return risk (any return in 30 days)
          description: >-
            Likelihood that a loyalty customer returns at least one item in the next 30 days. Kumo scores at most 1,000
            entities per request and there are 1,500 customers, so filter after FOR EACH, for example
            WHERE customers.tier = 'silver'.
          pql: PREDICT COUNT(returns.*, 0, 30, days) > 0 FOR EACH customers.customer_id
          anchor_time: "2026-10-01T00:00:00Z"
        - id: high_value_30d
          name: High-value purchase (over $300 in 30 days)
          description: >-
            Likelihood that a loyalty customer spends more than $300 in net order value in the next 30 days. Kumo scores at
            most 1,000 entities per request and there are 1,500 customers, so filter after FOR EACH, for example
            WHERE customers.tier = 'gold'.
          pql: PREDICT SUM(orders.net_amount, 0, 30, days) > 300 FOR EACH customers.customer_id
          anchor_time: "2026-10-01T00:00:00Z"

questions: questions.yaml
