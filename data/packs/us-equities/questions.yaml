#
# yaml-language-server: $schema=../../schemas/questions.schema.json
#
# The us-equities questions: the UI scenario list and the replay recording set (featured). Featured questions need
# only the default profiles. eval/oracles/ computes the analytics answers from a build, and eval/retrieval.yaml
# names the documents the retrieval answers cite. The pack has no ticker-linked news, so no question uses the news
# tools; SEC filings are a separate document source, connected to the prices only by company.
schema_version: "1"
# The composer's example picker, in order: the six featured questions and one question for each tool and source
# they leave out. Its first five rows show all six tools.
examples:
- unusual-sessions
- outcome-prediction
- peer-network
- sector-sql
- moves-and-filings
- market-leaders
- cyber-disclosure-rules
- intraday-ranges
- beneficial-ownership
- large-universe-scan
- nvidia-results-and-prices
- world-news-cyber
questions:
- id: market-leaders
  label: Market Leaders
  tag: ANALYTICS
  description: Scan the 50 most liquid US stocks for their strongest and weakest recent returns.
  question: >-
    Among the 50 most liquid US stocks, which had the strongest and weakest returns over the 20 trading sessions
    ending March 12, 2026, and how did their daily volatility compare?
  sources: [market_data]
  tools: [cudf]
  featured: true
- id: intraday-ranges
  label: Intraday Swings
  tag: INTRADAY
  description: Scan real one-minute bars for the sessions with the widest intraday swings.
  question: >-
    Among the 50 most liquid US stocks, which sessions from March 2 through March 12, 2026 had the widest intraday
    price ranges? For each, how did it trade from open to close, and how much of its volume came in the last 30
    minutes?
  sources: [market_data]
  tools: [cudf]
  featured: true
- id: unusual-sessions
  label: Unusual Sessions
  tag: ANOMALY
  description: Rank unusual return, volatility and volume combinations across the 50 most liquid stocks.
  question: >-
    Using 2025 as the baseline, which 10 sessions from January 2 through March 12, 2026 were the most unusual
    among the 50 most liquid US stocks, and which features made each one unusual? Anomaly scores are neither
    forecasts nor explanations.
  sources: [market_data]
  tools: [cudf, cuml]
  featured: true
- id: peer-network
  label: Peer Network
  tag: GRAPH
  description: Find the most central stocks in the return-correlation network of same-industry peers.
  question: >-
    Among declared industry peers, which stocks were the most central in the return-correlation network from
    December 2025 through March 12, 2026, and which pairs moved together most closely?
  sources: [market_data]
  tools: [cudf, cugraph]
  featured: true
- id: cyber-disclosure-rules
  label: Cybersecurity Disclosures
  tag: RETRIEVAL
  description: Pair the Form 8-K Item 1.05 rule with filings by companies in the pack that report an incident.
  question: >-
    What does Form 8-K Item 1.05 require a company to disclose about a material cybersecurity incident, and by
    when? Cite the regulation, and any 8-K filings in the corpus that report an incident under Item 1.05.
  sources: [sec_filings, market_regulations]
  tools: [retrieval]
  featured: true
- id: moves-and-filings
  label: Moves & Filings
  tag: HYBRID
  description: Price moves and SEC filings as two separate sources, joined only by company.
  question: >-
    Among the 50 most liquid US stocks, which three had the strongest and which three the weakest returns in
    February 2026? Separately, what did those six companies disclose in their 8-K filings from January through
    March 2026? Report the moves and the filings apart, and do not claim that a filing caused a move.
  sources: [market_data, sec_filings]
  tools: [cudf, retrieval]
  featured: true
- id: large-universe-scan
  label: Whole-Market Scan
  tag: ANALYTICS
  description: Scan the 500 most liquid stocks at once.
  question: >-
    Across the 500 most liquid US stocks, which 20 had the strongest and the weakest returns from January 2 to
    March 12, 2026, and how unusual was their trading volume?
  sources: [market_data]
  tools: [cudf]
- id: outcome-prediction
  label: Five-Session Outlook
  tag: PREDICTION
  description: Rank the 50 most liquid stocks with a five-session prediction anchored before the outcomes.
  question: >-
    As of the March 5, 2026 market close, which of the 50 most liquid stocks are most likely to post a positive
    five-session return?
  sources: [market_data]
  tools: [kumo]
- id: sector-sql
  label: Sector Breakdown
  tag: SQL
  description: Count stocks and summarize returns by SIC division with SQL.
  question: >-
    How many stocks are in each SIC division, and what was each division's median return from January 2 to
    March 12, 2026?
  sources: [market_data]
  tools: [ontology]
- id: world-news-rates
  label: World Headlines
  tag: RETRIEVAL
  description: Search the optional GDELT world news headlines, a source that is not linked to any stock.
  question: >-
    Which world news headlines in the corpus mention the Federal Reserve or another central bank? List their
    outlets and dates, and cite the headlines.
  sources: [world_news]
  tools: [retrieval]
- id: volatility-ranking
  label: Volatility Ranking
  tag: ANALYTICS
  description: Rank the 50 most liquid stocks by daily volatility over 60 sessions, with their returns.
  question: >-
    Among the 50 most liquid US stocks, which five had the highest and which five the lowest daily volatility over
    the 60 trading sessions ending March 12, 2026, and what were their returns over those sessions?
  sources: [market_data]
  tools: [cudf]
- id: peer-relative-returns
  label: Peer-Relative Returns
  tag: ANALYTICS
  description: Find the stocks that beat or trailed the group's average return by the most.
  question: >-
    Among the 50 most liquid US stocks, which five beat the group's average return by the most, and which five
    trailed it by the most, over the 20 trading sessions ending March 12, 2026?
  sources: [market_data]
  tools: [cudf]
- id: second-half-2025
  label: Second Half of 2025
  tag: ANALYTICS
  description: Scan the 500 most liquid stocks for the strongest and weakest returns of the second half of 2025.
  question: >-
    Among the 500 most liquid US stocks, which 10 had the strongest and which 10 the weakest returns from July 1
    through December 31, 2025, and how volatile was each one's daily trading?
  sources: [market_data]
  tools: [cudf]
- id: intraday-drawdowns
  label: Intraday Drawdowns
  tag: INTRADAY
  description: Scan real one-minute bars for the deepest falls from a session's running high.
  question: >-
    Among the 50 most liquid US stocks, which 10 sessions from February 2 through February 27, 2026 had the deepest
    drawdowns from the session's running high, and how did each one close relative to its open?
  sources: [market_data]
  tools: [cudf]
- id: heaviest-sessions
  label: Heaviest Sessions
  tag: INTRADAY
  description: Rank the sessions with the most shares traded, and show when in the day the volume came.
  question: >-
    Among the 50 most liquid US stocks, which 10 sessions from March 9 through March 12, 2026 traded the most
    shares, and how much of each session's volume came in its first and last 30 minutes?
  sources: [market_data]
  tools: [cudf]
- id: april-2025-anomalies
  label: April 2025 Anomalies
  tag: ANOMALY
  description: Score April 2025's sessions against a PCA model of the first quarter.
  question: >-
    Using January 2 through March 31, 2025 as the baseline, which 10 sessions in April 2025 were the most unusual
    among the 50 most liquid US stocks, and which features made each one unusual? Anomaly scores are neither
    forecasts nor explanations.
  sources: [market_data]
  tools: [cudf, cuml]
- id: fourth-quarter-anomalies
  label: Q4 2025 Anomalies
  tag: ANOMALY
  description: Score the fourth quarter of 2025 against the three before it, across the 500 most liquid stocks.
  question: >-
    Using January 2 through September 30, 2025 as the baseline, which 15 sessions in the fourth quarter of 2025
    were the most unusual among the 500 most liquid US stocks, and which features made each one unusual? Anomaly
    scores are neither forecasts nor explanations.
  sources: [market_data]
  tools: [cudf, cuml]
- id: central-industries
  label: Central Industries
  tag: GRAPH
  description: Name the industries of the most central stocks in the peer return-correlation network.
  question: >-
    Which 10 stocks were the most central in the declared-peer return-correlation network from December 2025
    through March 12, 2026, and which SEC industries are they in?
  sources: [market_data]
  tools: [cudf, cugraph]
- id: downside-outlook
  label: Downside Outlook
  tag: PREDICTION
  description: Rank the 50 most liquid stocks by the predicted chance of a five-session fall of more than 5%.
  question: >-
    As of the March 5, 2026 market close, which of the 50 most liquid US stocks are most likely to fall more than
    5% over the next five sessions?
  sources: [market_data]
  tools: [kumo]
- id: named-stock-outlook
  label: Named-Stock Outlook
  tag: PREDICTION
  description: Predict both five-session outcomes for five named stocks.
  question: >-
    As of the March 5, 2026 market close, how likely are NVIDIA (NVDA), Apple (AAPL), Microsoft (MSFT), Tesla
    (TSLA) and JPMorgan Chase (JPM) to post a positive five-session return, and how likely is each to fall more
    than 5%?
  sources: [market_data]
  tools: [kumo]
- id: exchange-listings
  label: Exchange Listings
  tag: SQL
  description: Count the pack's stocks by listing exchange with SQL.
  question: >-
    How many stocks in the pack are listed on each exchange, and how many of the 500 and of the 50 most liquid are
    on each?
  sources: [market_data]
  tools: [ontology]
- id: big-move-days
  label: Big-Move Days
  tag: SQL
  description: Count each liquid stock's 2025 sessions with a daily move of more than 10%.
  question: >-
    Among the 500 most liquid US stocks, which 10 had the most sessions in 2025 with a close-to-close move of more
    than 10% in either direction, and what were their largest rise and fall?
  sources: [market_data]
  tools: [ontology]
- id: executive-changes
  label: Executive Changes
  tag: RETRIEVAL
  description: Summarize 8-K filings about executive and director changes (Item 5.02).
  question: >-
    Which companies filed 8-Ks under Item 5.02 about executive or director changes in January and February 2026?
    Summarize three of them, and cite the filings.
  sources: [sec_filings]
  tools: [retrieval]
- id: material-agreements
  label: Material Agreements
  tag: RETRIEVAL
  description: Summarize 8-K filings about entering or ending material agreements (Items 1.01 and 1.02).
  question: >-
    Which 8-K filings from February and March 2026 report entering into or terminating a material definitive
    agreement under Item 1.01 or 1.02? Summarize three of the agreements, and cite the filings.
  sources: [sec_filings]
  tools: [retrieval]
- id: restructuring-costs
  label: Restructuring Costs
  tag: RETRIEVAL
  description: Find 8-K filings that disclose exit or restructuring costs (Item 2.05).
  question: >-
    Which companies disclosed exit or restructuring costs under 8-K Item 2.05, and what charges did each expect?
    Cite the filings.
  sources: [sec_filings]
  tools: [retrieval]
- id: beneficial-ownership
  label: Beneficial Ownership
  tag: RETRIEVAL
  description: Explain the Schedule 13D and 13G filing deadlines in Title 17.
  question: >-
    Under Title 17, when must a person who acquires more than five percent of a class of registered equity
    securities file a Schedule 13D, and when may they file a Schedule 13G instead? Cite the sections.
  sources: [market_regulations]
  tools: [retrieval]
- id: shareholder-proposals
  label: Shareholder Proposals
  tag: RETRIEVAL
  description: Explain Rule 14a-8's eligibility requirements for shareholder proposals.
  question: >-
    Under Rule 14a-8 in Title 17, what ownership and holding-period requirements must a shareholder meet to have a
    proposal included in a company's proxy statement? Cite the section.
  sources: [market_regulations]
  tools: [retrieval]
- id: world-news-cyber
  label: Cyber Headlines
  tag: RETRIEVAL
  description: Search the optional GDELT world news headlines for cyber attacks.
  question: >-
    Which world news headlines in the corpus are about cyber attacks? List their outlets and dates, and cite the
    headlines.
  sources: [world_news]
  tools: [retrieval]
- id: nvidia-results-and-prices
  label: NVIDIA Prices & Filings
  tag: HYBRID
  description: NVIDIA's price context and its 8-K filings, as two separate sources.
  question: >-
    How did NVIDIA (NVDA) trade from February 2 through March 12, 2026? Separately, what did its 8-K filings in
    that period disclose? Report the prices and the filings apart, and do not claim that a filing caused a move.
  sources: [market_data, sec_filings]
  tools: [cudf, retrieval]
- id: bank-results
  label: Bank Results
  tag: HYBRID
  description: Five large banks' January 2026 moves beside their results 8-Ks, kept apart.
  question: >-
    How did JPMorgan Chase, Bank of America, Wells Fargo, Citigroup and Goldman Sachs trade in January 2026?
    Separately, what did their January 2026 results 8-Ks report? Report the moves and the filings apart, and do
    not claim that a filing caused a move.
  sources: [market_data, sec_filings]
  tools: [cudf, retrieval]
# Multi-turn conversations, each recorded as one replay session with --all: a later turn refers to an earlier answer.
conversations:
- id: price-context-follow-up
  label: Price Context Follow-up
  tag: ANALYTICS
  description: Summarize two stocks' daily price context, then add a third and aggregate the series weekly.
  sources: [market_data]
  turns:
  - >-
    Summarize the daily price context for NVIDIA (NVDA) and Apple (AAPL) from February 2 through February 27, 2026,
    including each stock's return, price range and average volume.
  - Keep that same window and add Microsoft (MSFT), but aggregate the displayed series weekly.
- id: peer-network-follow-up
  label: Peer Network Follow-up
  tag: GRAPH
  description: Find the most central peers, then compare their returns and volatility over the same window.
  sources: [market_data]
  turns:
  - >-
    Among declared industry peers, which five stocks were the most central in the return-correlation network from
    December 2025 through March 12, 2026?
  - >-
    For the three most central stocks in that result, compare their returns and daily volatility over the same
    window.
- id: leaders-unusual-sessions
  label: Leaders & Unusual Sessions
  tag: ANOMALY
  description: Rank the strongest and weakest recent returns, then check those stocks for unusual sessions.
  sources: [market_data]
  turns:
  - >-
    Among the 50 most liquid US stocks, which three had the strongest and which three the weakest returns over the
    20 trading sessions ending March 12, 2026?
  - >-
    Using 2025 as the baseline, did any of those six stocks have unusual sessions in that same window? Name the
    sessions and the features that made each one unusual. Anomaly scores are neither forecasts nor explanations.
- id: filings-to-regulations
  label: Filings & Regulations
  tag: RETRIEVAL
  description: Pick two 8-K cybersecurity incident filings, then compare them with the Title 17 requirements.
  sources: [sec_filings, market_regulations]
  turns:
  - >-
    Which 8-K filings in the corpus report a cybersecurity incident under Item 1.05? Select two examples with
    materially different disclosed impacts, and cite the filings.
  - >-
    For those same two examples, compare the disclosed facts with the Title 17 cybersecurity incident disclosure
    requirements, and identify what the evidence does not establish.
- id: regulation-fd-follow-up
  label: Regulation FD Follow-up
  tag: RETRIEVAL
  description: When Regulation FD requires public disclosure, then intentional and unintentional cases apart.
  sources: [market_regulations]
  turns:
  - >-
    Under Regulation FD in Title 17, when must an issuer publicly disclose material nonpublic information that it
    shared with certain persons outside the company? Cite the relevant sections.
  - >-
    Now separate the intentional and the unintentional selective disclosure cases, and say how the issuer may make
    the public disclosure, keeping the section citations.
- id: mega-cap-follow-up
  label: Mega-Cap Follow-up
  tag: ANALYTICS
  description: Summarize four large stocks' price context, then compare it with the previous quarter, monthly.
  sources: [market_data]
  turns:
  - >-
    Summarize the price context for Apple (AAPL), Microsoft (MSFT), Amazon (AMZN) and Alphabet (GOOGL) from
    January 2 through March 12, 2026, including each stock's return, price range and average volume.
  - >-
    Keep the same four stocks and compare that with October 1 through December 31, 2025, aggregating both series
    monthly.
- id: april-2025-follow-up
  label: April 2025 Follow-up
  tag: ANALYTICS
  description: Find the steepest early-April 2025 declines, then follow those stocks through the next week.
  sources: [market_data]
  turns:
  - Among the 50 most liquid US stocks, which five had the weakest returns from April 1 through April 8, 2025?
  - How did those five stocks trade over the following sessions, from April 9 through April 15, 2025?
- id: intraday-volatility-follow-up
  label: Intraday Volatility Follow-up
  tag: INTRADAY
  description: Rank minute-level volatility for three stocks, then look inside the most volatile sessions.
  sources: [market_data]
  turns:
  - >-
    For NVIDIA (NVDA), Tesla (TSLA) and AMD, which 10 sessions from January 2 through March 12, 2026 had the
    highest minute-by-minute realized volatility?
  - >-
    For the three most volatile of those sessions, how did each trade from open to close, what was its VWAP, and
    how much of its volume came in the last 30 minutes?
- id: prediction-follow-up
  label: Prediction Follow-up
  tag: PREDICTION
  description: Rank a five-session outlook, then compare it with the returns that followed.
  sources: [market_data]
  turns:
  - >-
    As of the March 5, 2026 market close, which five of the 50 most liquid US stocks are most likely to post a
    positive five-session return?
  - >-
    What were those five stocks' actual returns from the March 5 close through March 12, 2026? Compare them with
    the predictions, without treating one week as a test of the model.
- id: peer-links-follow-up
  label: Peer Links Follow-up
  tag: GRAPH
  description: List the strongest peer correlations, then compare the strongest pair's returns.
  sources: [market_data]
  turns:
  - >-
    In the declared-peer return-correlation network from December 2025 through March 12, 2026, which 10 pairs of
    stocks were the most strongly correlated, and did any pair move in opposite directions?
  - >-
    For the most strongly correlated pair in that result, compare the two stocks' returns and daily volatility over
    the same window.
- id: sector-follow-up
  label: Sector Follow-up
  tag: SQL
  description: Count stocks by SIC division, then break the largest division down by industry.
  sources: [market_data]
  turns:
  - How many of the pack's stocks are in each SIC division, and how many of each are among the 500 most liquid?
  - For the division with the most stocks among the 500 most liquid, which five industries hold the most of them?
- id: results-follow-up
  label: Results Follow-up
  tag: RETRIEVAL
  description: Find five large companies' quarterly results 8-Ks, then pull the figures from two of them.
  sources: [sec_filings]
  turns:
  - >-
    Which of NVIDIA, Apple, Microsoft, Amazon and Meta filed quarterly results 8-Ks under Item 2.02 in January or
    February 2026? List each company and filing date, and cite the filings.
  - >-
    For the first two companies in that result, what revenue and earnings figures did their results releases
    report? Cite the exhibits.
- id: trading-plans-follow-up
  label: Rule 10b5-1 Follow-up
  tag: RETRIEVAL
  description: Explain Rule 10b5-1 trading plan conditions, then contrast directors and officers with others.
  sources: [market_regulations]
  turns:
  - >-
    What conditions does Rule 10b5-1 in Title 17 place on trading plans used for the affirmative defense,
    including cooling-off periods? Cite the section.
  - >-
    Now contrast the conditions for directors and officers with those for other persons, keeping the section
    citations.
- id: headlines-and-prices
  label: Headlines & Prices
  tag: HYBRID
  description: World headlines that mention Nvidia, then NVDA's prices that month, as separate sources.
  sources: [world_news, market_data]
  turns:
  - >-
    Which world news headlines from February 2025 mention Nvidia? List their outlets and dates, and cite the
    headlines.
  - >-
    Separately, how did NVIDIA (NVDA) trade in February 2025? Report the prices apart from the headlines, and do
    not claim that a headline caused a move.
- id: incidents-and-prices
  label: Incidents & Prices
  tag: HYBRID
  description: Item 1.05 cybersecurity incident filings, then the filers' prices after each, kept apart.
  sources: [sec_filings, market_data]
  turns:
  - >-
    Which companies reported a material cybersecurity incident on Form 8-K under Item 1.05, and when did each
    file? Cite the filings.
  - >-
    How did each of those companies' stocks trade over the five sessions after its filing? Report the prices
    separately from the filings, and do not claim that a filing caused a move.
