#
# The GPU performance guard's cases (`./scripts/demo.sh test gpu --perf`, eval/README.md); never read at runtime.
# `market` cases go to market-analytics' POST /benchmark, which times each call on its CPU and GPU engines in
# alternating pairs; `retrieval` names the profiles of the Milvus CPU/GPU index comparison (retrieval-benchmark.json).
# `recorded` lists the CPU/GPU speedups measured on a 40 GB A100 (12 vCPUs):
#   - 2026-09-29: the isolated method of docs/operations.md (Brev VM mode, step 7) on the same 2,000-issuer scale;
#   - 2026-10-01: POST /benchmark on the running stack, for the recorded sessions' calls (each session's Benchmark).
# A case fails below `min_speedup`, half its lowest recorded speedup rounded down to 0.05; a case recorded slower on
# the GPU has none and is only reported.
profile: standard # the windows and universes below are those of the standard profile (2,000 issuers since 2024)

market:
  - id: scan-all-issuers
    tool: market_scan
    arguments: {universe_id: all_assets, start: "2024-01-02T00:00:00Z", end: "2026-08-31T23:59:59Z",
      metrics: [return, volatility], limit: 20}
    recorded: [3.0, 3.74, 3.96]
    min_speedup: 1.5
  - id: scan-all-issuers-volume-zscore
    tool: market_scan
    arguments: {universe_id: all_assets, start: "2024-01-02T00:00:00Z", end: "2026-08-31T23:59:59Z",
      metrics: [volume], comparison: zscore, limit: 10}
    recorded: [2.8]
    min_speedup: 1.4
  - id: scan-top-12-20-sessions
    tool: market_scan
    arguments: {universe_id: top_12, sessions: 20, end: "2026-08-31T23:59:59Z", metrics: [return, volatility],
      limit: 12}
    recorded: [1.5, 1.61, 1.80]
    min_speedup: 0.75
  - id: anomalies-all-issuers
    tool: market_anomaly_scan
    arguments: {universe_id: all_assets, training_start: "2026-01-02T00:00:00Z", training_end: "2026-06-30T23:59:59Z",
      scoring_start: "2026-07-01T00:00:00Z", scoring_end: "2026-08-31T23:59:59Z", limit: 10}
    recorded: [2.5, 2.43, 1.51, 1.16]
    min_speedup: 0.55
  - id: anomalies-top-12
    tool: market_anomaly_scan
    arguments: {universe_id: top_12, training_start: "2026-01-02T00:00:00Z", training_end: "2026-06-30T23:59:59Z",
      scoring_start: "2026-07-01T00:00:00Z", scoring_end: "2026-08-31T23:59:59Z", limit: 10}
    recorded: [1.8]
    min_speedup: 0.9
  - id: price-context-story-issuers
    tool: price_context
    arguments: {asset_ids: [STIO, GIST, TISL, PRAL, VIAS, SOUS, GIOR, CLAE, PEAX, KASI, HARE],
      start: "2026-08-16T00:00:00Z", end: "2026-08-31T23:59:59Z", frequency: daily, include_series: true,
      point_limit: 200}
    recorded: [2.3]
    min_speedup: 1.15
  - id: peer-network
    tool: analyze_market_relationships
    arguments: {top_k: 10}
    recorded: [1.0, 1.23, 1.24]
    min_speedup: 0.5
  # 8.1x on 2026-09-29 against an 84,000-item news table; this pack's 12-issuer news calls ran slower on the GPU
  # (0.55x to 0.84x on 2026-10-01), so this one is reported, not guarded.
  - id: news-price-all-issuers
    tool: analyze_news_price_relationship
    arguments: {published_from: "2026-08-18T00:00:00Z", published_to: "2026-08-28T23:59:59Z"}
    recorded: [8.1]
    min_speedup: null

# GPU_IVF_FLAT against the CPU HNSW index, 2026-10-01 (the pack's 15 held-out queries)
retrieval:
  vector-single: {recorded: [1.18], min_speedup: 0.55}
  vector-batch: {recorded: [1.15], min_speedup: 0.55}
  vector-concurrency: {recorded: [1.12], min_speedup: 0.55}
