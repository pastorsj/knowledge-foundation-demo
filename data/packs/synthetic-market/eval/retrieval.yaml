#
# What a correct retrieval answer cites, by question id: answer checks, never read at runtime. `documents` are
# corpus/documents.jsonl ids; `filings` are corpus manifest filing ids (<cik>:<accession>), whose documents are
# edgar:<cik>:<accession>:<file>. An answer should cite at least one document and one filing of each list.
cyber-disclosure-rules:
  documents:
    - ecfr-title17:229.106:24c220ed7a14 # 17 CFR 229.106, Regulation S-K Item 106 (cybersecurity)
    - ecfr-title17:249.308:4a810383a174 # 17 CFR 249.308, Form 8-K
    - fr-2023-16194:appendix-c-form-8-k # Form 8-K Item 1.05 and its four-business-day deadline (88 FR 51896)
  filings: # the only 8-K in the 2026 Q2 sample that reports Item 1.05
    - 0001605301:0001605301-26-000021 # CB Financial Services, 2026-05-11
news-and-filings:
  # The filing half: filings in the 2026 Q2 sample that report a disruption of the filer's own operations (not the
  # risk lists of forward-looking statements, which say only what could happen).
  filings:
    - 0000879764:0001104659-26-050851 # TotalEnergies 6-K, 2026-04-29: production shut down in Qatar, Iraq, UAE offshore
    - 0001429937:0001429937-26-000007 # B2Gold 6-K, 2026-05-07: a fire at the Goose Mine crushing circuit cut output
    - 0001854640:0001628280-26-028450 # Centerra Gold 6-K, 2026-04-29: Langeloth operations suspended after an explosion
    - 0001699136:0001628280-26-031637 # Cactus 8-K, 2026-05-07: Middle East logistics disruptions hit Pressure Control
