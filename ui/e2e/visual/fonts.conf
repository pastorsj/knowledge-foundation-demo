<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fontconfig for the visual baselines (FONTCONFIG_FILE in run.sh). The UI's text is in the system
  font (system-ui, sans-serif, monospace); in the Playwright image those resolve to WenQuanYi Zen
  Hei, which has no bold. FreeSans and Liberation Mono, also in the image, have bold, so a change
  of weight shows in a baseline. FreeSans also has the symbols the UI draws as text, such as the
  replay bar's play triangle, which the UI's font stack would otherwise take from its color emoji
  font.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>sans-serif</string></edit>
  </match>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>FreeSans</family>
      <family>Liberation Sans</family>
      <family>WenQuanYi Zen Hei</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Liberation Mono</family>
      <family>FreeMono</family>
      <family>WenQuanYi Zen Hei Mono</family>
    </prefer>
  </alias>
</fontconfig>
