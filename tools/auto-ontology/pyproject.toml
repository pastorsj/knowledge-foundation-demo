[project]
name = "demo-auto-ontology"
version = "0.1.0"
description = "Auto Ontology (the ontology profile): upstream patches and source preparation."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gpu: needs an NVIDIA GPU",
    "slow: slow test",
    "live: calls real endpoints; never run in CI",
]
