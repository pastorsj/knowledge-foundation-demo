[project]
name = "demo-eval"
version = "0.1.0"
description = "On-demand answer-quality eval of a running Knowledge Foundation deployment."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml>=6.0.3"]

[project.scripts]
demo-eval = "demo_eval.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["uv_build>=0.11.28,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "demo_eval"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow test",
    "live: calls a real deployment or grader; never run in CI",
]
