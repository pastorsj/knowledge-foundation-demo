#
# The whole demo in one Compose file. Profiles pick what runs:
#   core           OpenShell gateway + Hermes forwarder, Switchyard, Phoenix, API, UI, ingest, Milvus, and the
#                  retrieval and tables MCP servers: documents and tables are the product
#   parse          NVIDIA Nemotron Parse 2.0 on vLLM (an NVIDIA GPU; the DGX Spark and x86_64 both)
#   kumo           Kumo Relational NIM (x86_64 + NVIDIA GPU) and the prediction MCP server
#   prediction     the prediction MCP server alone, against a remote Kumo NIM (KUMO_RELATIONAL_URL), e.g. on a Spark
#   ontology       Auto Ontology (the vendor/auto-ontology submodule, private until it is published)
#   replay         the UI alone, on the recorded sessions: no keys, no API, no GPU
#   build, tools   the agent sandbox image and the OpenShell CLI, used by scripts/demo.sh
#
# Use scripts/demo.sh: it orders the bring-up around the OpenShell sandbox, which Compose
# does not manage. By hand, pass the OpenShell pins along with .env:
#   docker compose --env-file infra/openshell/versions.env --env-file .env ...
#
# Every host port is published on 127.0.0.1 only, except the UI's when UI_BIND_HOST says
# otherwise (for a link that requires sign-in, such as a Brev link). The ports are a block of their own
# (3300, 4300, 6306, 83xx, 1838x) so the demo shares a host with others. The sandbox reaches services as
# host.openshell.internal:<host port>, which the host-networked OpenShell supervisor maps to
# 127.0.0.1. No variable is required (never ${VAR:?}), so the replay profile needs no .env.
# Keys reach services as Compose secrets (/run/secrets/<name>), not environment variables.
# Exceptions: upstream Auto Ontology (ontology profile) reads its keys from env, and so does
# the prediction server for an optional hosted Kumo key.
#
# An image several services share is built by one of them only: Compose labels each build with its
# service, so two builds of one image would give it a new ID on every build.
name: knowledge-foundation

x-restart: &restart
  restart: unless-stopped

x-openshell-cli: &openshell-cli
  image: knowledge-foundation/openshell-cli:local
  user: "0"
  environment:
    # `openshell` is a default SAN of the gateway certificate, so keep this service name.
    OPENSHELL_GATEWAY: openshell
    OPENSHELL_GATEWAY_ENDPOINT: https://openshell:18080
    XDG_CONFIG_HOME: /client
  volumes:
    - openshell-client:/client
    - ./infra/openshell/providers:/providers:ro
  networks: [openshell]

# The retriever endpoint: embeddings for ingest and retrieval, reranking for retrieval. Empty values mean the
# services' defaults (build.nvidia.com and the Nemotron models).
x-retriever-env: &retriever-env
  RETRIEVER_BASE_URL: ${RETRIEVER_BASE_URL:-}
  RETRIEVER_EMBED_MODEL: ${RETRIEVER_EMBED_MODEL:-}
  RETRIEVER_RERANK_MODEL: ${RETRIEVER_RERANK_MODEL-nvidia/llama-nemotron-rerank-vl-1b-v2} # empty: no reranking
  RETRIEVER_RERANK_URL: ${RETRIEVER_RERANK_URL:-}
  MILVUS_URI: http://milvus:19530
  KNOWLEDGE_DIR: /knowledge

secrets:
  inference_api_key: { environment: INFERENCE_API_KEY }
  capable_api_key: { environment: CAPABLE_API_KEY } # empty: the inference key, on the inference endpoint only
  retriever_api_key: { environment: RETRIEVER_API_KEY } # demo.sh fills an empty one from INFERENCE_API_KEY
  parse_api_key: { environment: PARSE_API_KEY } # a hosted Parse endpoint only; the local vLLM needs none
  hermes_api_server_key: { environment: HERMES_API_SERVER_KEY }
  hermes_receipt_api_key: { environment: HERMES_RECEIPT_API_KEY }
  auto_ontology_password: { environment: AUTO_ONTOLOGY_ADMIN_PASSWORD }
  speech_api_key: { environment: SPEECH_API_KEY } # voice input; demo.sh fills an empty one (env.sh)

networks:
  default: {}
  openshell: {}

services:
  # ---------------------------------------------------------------- OpenShell (core)
  # The images come from infra/openshell/versions.env. demo.sh creates the Hermes sandbox
  # through the gateway after everything the sandbox calls is up.
  openshell-certs:
    profiles: [core]
    image: ${OPENSHELL_GATEWAY_IMAGE}
    user: "0"
    network_mode: none
    environment:
      XDG_CONFIG_HOME: /client
    command: [generate-certs, --output-dir, /var/lib/openshell/tls]
    volumes:
      - openshell-state:/var/lib/openshell
      - openshell-client:/client

  openshell-preflight:
    profiles: [core]
    image: ${OPENSHELL_GATEWAY_IMAGE}
    user: "0"
    network_mode: none
    command: [config, preflight, --path, /etc/openshell/gateway.toml]
    volumes:
      - ./infra/openshell/gateway.toml:/etc/openshell/gateway.toml:ro

  openshell:
    <<: *restart
    profiles: [core]
    image: ${OPENSHELL_GATEWAY_IMAGE}
    user: "0" # the Docker compute driver needs the Docker socket
    command: [--config, /etc/openshell/gateway.toml]
    networks: [openshell]
    ports:
      - "127.0.0.1:18380:18080" # gRPC/mTLS; the host-networked supervisor dials it (gateway.toml grpc_endpoint)
      - "127.0.0.1:18381:18081" # /readyz; the image is distroless, so demo.sh polls it
    environment:
      OPENSHELL_DB_URL: sqlite:/var/lib/openshell/gateway.db?mode=rwc
      OPENSHELL_LOCAL_TLS_DIR: /var/lib/openshell/tls
      OPENSHELL_TELEMETRY_ENABLED: "false"
      XDG_STATE_HOME: /var/lib/openshell
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - openshell-state:/var/lib/openshell
      - ./infra/openshell/gateway.toml:/etc/openshell/gateway.toml:ro
    depends_on:
      openshell-certs: { condition: service_completed_successfully }
      openshell-preflight: { condition: service_completed_successfully }

  # The API's way in to Hermes, which listens on 127.0.0.1:8642 inside the sandbox.
  # Start it only once the sandbox is Ready (demo.sh does).
  hermes-gateway:
    <<: [*openshell-cli, *restart]
    profiles: [core]
    build: { context: infra/openshell, dockerfile: cli.Dockerfile } # also the openshell-cli image
    networks: [default, openshell]
    command: [forward, service, hermes, --target-port, "8642", --local, "0.0.0.0:8642"]
    healthcheck:
      test: [CMD, curl, -fs, -o, /dev/null, -m, "3", http://127.0.0.1:8642/health] # the one route without a key
      interval: 5s
      timeout: 5s
      retries: 12

  openshell-cli:
    <<: *openshell-cli
    profiles: [tools]

  agent:
    profiles: [build]
    image: knowledge-foundation/hermes-sandbox:local
    build:
      context: agent
      additional_contexts: { contracts: ./contracts }
      # demo.sh derives this from COMPOSE_PROFILES; the default matches core.
      args: { AGENT_FEATURES: "${AGENT_FEATURES-retrieval,tables}" }

  # ---------------------------------------------------------------- core services
  switchyard:
    <<: *restart
    profiles: [core]
    build: infra/switchyard
    image: knowledge-foundation/switchyard:local
    # Not read_only: Compose writes environment-sourced secrets into the container, which a
    # read-only root filesystem refuses. It runs as uid 1000 with no capabilities instead.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:4300:4000"]
    secrets: [inference_api_key, capable_api_key] # the only holder of the model keys on the agent path
    environment:
      SWITCHYARD_ROUTES: ${SWITCHYARD_ROUTES:-}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-}
      CAPABLE_BASE_URL: ${CAPABLE_BASE_URL:-} # empty: INFERENCE_BASE_URL
      AGENT_EFFICIENT_MODEL: ${AGENT_EFFICIENT_MODEL:-}
      AGENT_CAPABLE_MODEL: ${AGENT_CAPABLE_MODEL:-}
      AGENT_JUDGE_MODEL: ${AGENT_JUDGE_MODEL:-}
      AGENT_AUX_MODEL: ${AGENT_AUX_MODEL:-}
      SWITCHYARD_CONFIRMATIONS: ${SWITCHYARD_CONFIRMATIONS:-1}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://phoenix:6006/v1/traces
      OTEL_SERVICE_NAME: switchyard
      # The agent's Phoenix project (agent/profile/relay-plugins.toml). These spans join each job's
      # trace, and Phoenix files a trace under the project of its first span to arrive.
      OTEL_RESOURCE_ATTRIBUTES: openinference.project.name=knowledge-foundation
    # routing.jsonl is 0700 uid 1000: mount this volume nowhere else. Read routing stats
    # from GET /v1/routing/session-stats instead.
    volumes: [switchyard-data:/var/lib/switchyard]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000"]

  phoenix:
    <<: *restart
    profiles: [core]
    # The non-root variant (uid 65532). Its home is owned by that uid, so a new volume there is too.
    image: arizephoenix/phoenix:version-20.16.0-nonroot@sha256:e4a41a209b07289581a5d48167a11051c12704ac48983056fe0989b6f13b467a
    # `phoenix serve` with a longer keep-alive, or Relay loses spans behind the OpenShell proxy.
    command: [/serve.py]
    ports: ["127.0.0.1:6306:6006"] # UI and OTLP/HTTP /v1/traces; traces hold full payloads
    environment:
      PHOENIX_WORKING_DIR: /home/nonroot
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
    volumes:
      - phoenix-data:/home/nonroot
      - ./infra/phoenix/serve.py:/serve.py:ro
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s

  api:
    <<: *restart
    profiles: [core]
    build: { context: api, additional_contexts: { contracts: ./contracts } }
    image: knowledge-foundation/api:local
    # Room to fail live jobs and stop their Hermes runs on shutdown (Docker's default is 10 s).
    stop_grace_period: 30s
    ports: ["127.0.0.1:8300:8000"] # the sandbox may call only /internal/hermes/** (receipts provider)
    # Settings: api/src/demo_api/settings.py. Keys arrive as files in /run/secrets.
    secrets: [hermes_api_server_key, hermes_receipt_api_key, auto_ontology_password, speech_api_key]
    environment:
      HERMES_URL: http://hermes-gateway:8642
      INGEST_URL: http://ingest:8330
      KNOWLEDGE_DIR: /knowledge
      # Voice input (.env section 6): Nemotron ASR on build.nvidia.com; off unless enabled and keyed
      SPEECH_INPUT_ENABLED: ${SPEECH_INPUT_ENABLED:-false}
      SPEECH_INPUT_MAX_SECONDS: ${SPEECH_INPUT_MAX_SECONDS:-60}
      SPEECH_CLEANUP_MODEL: ${SPEECH_CLEANUP_MODEL:-}
      AIQ_PHOENIX_INTERNAL_URL: http://phoenix:6006
      AGENT_FEATURES: ${AGENT_FEATURES-retrieval,tables}
      # Switchyard's model ids, which name each model call's tier (`demo.sh restart switchyard` refreshes them)
      AGENT_EFFICIENT_MODEL: ${AGENT_EFFICIENT_MODEL:-}
      AGENT_CAPABLE_MODEL: ${AGENT_CAPABLE_MODEL:-}
      JOB_RETENTION_SECONDS: ${JOB_RETENTION_SECONDS:-86400}
      INGEST_MAX_REQUEST_MB: ${INGEST_MAX_REQUEST_MB:-512}
      # demo.sh sets http://auto-ontology-frontend:3000 under the ontology profile; empty = off.
      AUTO_ONTOLOGY_URL: ${AUTO_ONTOLOGY_URL:-}
      AUTO_ONTOLOGY_EMAIL: admin@example.com
      AUTO_ONTOLOGY_SOURCE: ${AUTO_ONTOLOGY_SOURCE:-retail.sales}
    volumes: [api-data:/var/lib/demo-api, knowledge:/knowledge:ro]
    # No dependency on hermes-gateway: the API must be up before the sandbox is created.
    depends_on:
      ingest: { condition: service_healthy }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ui:
    <<: *restart
    profiles: [core, replay]
    build: ui
    image: knowledge-foundation/ui:local
    ports: ["${UI_BIND_HOST:-127.0.0.1}:${UI_PORT:-3300}:3000"] # the only non-loopback opt-in
    environment:
      UI_MODE: ${UI_MODE:-live} # demo.sh replay sets replay
      API_URL: http://api:8000
      PACKS_DIR: /packs
      DEFAULT_PACK: ${DEFAULT_PACK:-retail}
      PHOENIX_URL: ${PHOENIX_URL-http://127.0.0.1:6306} # empty hides the Phoenix link
      SPEECH_INPUT_ENABLED: ${SPEECH_INPUT_ENABLED:-false} # the microphone (live mode only)
      SPEECH_INPUT_MAX_SECONDS: ${SPEECH_INPUT_MAX_SECONDS:-60}
      FILE_UPLOAD_MAX_SIZE_MB: ${INGEST_MAX_FILE_MB:-100}
      FILE_UPLOAD_MAX_FILE_COUNT: ${INGEST_MAX_FILES:-20}
      FILE_UPLOAD_MAX_REQUEST_MB: ${INGEST_MAX_REQUEST_MB:-512}
    volumes: [./data/packs:/packs:ro]
    depends_on:
      api: { condition: service_healthy, required: false } # not in the replay profile

  # ---------------------------------------------------------------- knowledge: ingest, Milvus, tools
  # The only writer of the knowledge catalog. Uploads arrive through the API; industry packs (data/packs) are
  # ingested in the background at startup through the same pipeline (docs/ingestion.md).
  ingest:
    <<: *restart
    profiles: [core]
    build:
      context: ingest
      additional_contexts: { contracts: ./contracts/catalog, packschemas: ./data/schemas }
    image: knowledge-foundation/ingest:local
    ports: ["127.0.0.1:8330:8330"]
    secrets: [retriever_api_key, parse_api_key]
    environment:
      <<: *retriever-env
      PACKS_DIR: /packs
      # demo.sh sets http://parse:8000/v1 under the parse profile; or a hosted Nemotron Parse endpoint; empty: text
      # layer only (PDFs) and no images.
      PARSE_BASE_URL: ${PARSE_BASE_URL:-}
      PARSE_MODEL: ${PARSE_MODEL:-nvidia/NVIDIA-Nemotron-Parse-2.0}
      PARSE_CONCURRENCY: ${PARSE_CONCURRENCY:-4}
      PARSE_MAX_TOKENS: ${PARSE_MAX_TOKENS:-8192}
      INGEST_WORKERS: ${INGEST_WORKERS:-2}
      INGEST_MAX_FILE_MB: ${INGEST_MAX_FILE_MB:-100}
      INGEST_MAX_FILES: ${INGEST_MAX_FILES:-20}
      INGEST_STAGE_TIMEOUT_SECONDS: ${INGEST_STAGE_TIMEOUT_SECONDS:-1800}
    volumes: [knowledge:/knowledge, ./data/packs:/packs:ro]
    depends_on:
      milvus: { condition: service_healthy }
      # Packs ingest at startup: wait for Parse so their PDFs are parsed, not read from the text layer.
      parse: { condition: service_healthy, required: false }

  # CPU standalone Milvus: embedded etcd and local storage, no MinIO (official standalone_embed.sh).
  milvus:
    <<: *restart
    profiles: [core]
    image: milvusdb/milvus:v2.6.25@sha256:29f7668e64df1c6d5cdadbfbee99f38c72e4001054f149a298725acae57230ad
    command: [milvus, run, standalone]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - milvus-data:/var/lib/milvus
      - ./tools/retrieval/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./tools/retrieval/milvus/user.yaml:/milvus/configs/user.yaml:ro
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 10s
      timeout: 20s
      retries: 30
      start_period: 90s

  retrieval:
    <<: *restart
    profiles: [core]
    build: tools/retrieval
    image: knowledge-foundation/retrieval:local
    command: [serve]
    ports: ["127.0.0.1:8320:8320"]
    secrets: [retriever_api_key]
    environment:
      <<: *retriever-env
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://phoenix:6006/v1/traces
      OTEL_RESOURCE_ATTRIBUTES: openinference.project.name=knowledge-foundation # as Switchyard's
    volumes: [knowledge:/knowledge:ro]
    depends_on:
      milvus: { condition: service_healthy }

  tables:
    <<: *restart
    profiles: [core]
    build: tools/tables
    image: knowledge-foundation/tables:local
    ports: ["127.0.0.1:8321:8321"]
    environment:
      KNOWLEDGE_DIR: /knowledge
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://phoenix:6006/v1/traces
      OTEL_RESOURCE_ATTRIBUTES: openinference.project.name=knowledge-foundation
    volumes: [knowledge:/knowledge:ro]

  # ---------------------------------------------------------------- Nemotron Parse (parse)
  # vLLM serving nvidia/NVIDIA-Nemotron-Parse-2.0 as its model card prescribes, pinned to a revision. The card's
  # runtime patch (vllm_tied_patch/sitecustomize.py, from the same revision) ties the output head to the decoder
  # embeddings; without it this vLLM emits only <s>. The weights download into parse-cache on the first start.
  parse:
    <<: *restart
    profiles: [parse]
    image: vllm/vllm-openai:v0.27.1@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
    gpus: all
    ipc: host
    ports: ["127.0.0.1:8340:8000"]
    environment:
      HF_HOME: /root/.cache/huggingface
      PARSE_REVISION: b6742064f4a8cf22a10383ece5e7fbead355ac04
      PARSE_GPU_MEMORY_UTILIZATION: ${PARSE_GPU_MEMORY_UTILIZATION:-0.15}
    entrypoint: [/bin/sh, /parse-entrypoint.sh]
    volumes:
      - parse-cache:/root/.cache/huggingface
      - ./infra/parse/entrypoint.sh:/parse-entrypoint.sh:ro
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 60
      start_period: 900s # the first start downloads the weights

  # ---------------------------------------------------------------- Kumo (kumo, prediction)
  prediction:
    <<: *restart
    profiles: [kumo, prediction]
    build: tools/prediction
    image: knowledge-foundation/prediction:local
    ports: ["127.0.0.1:8322:8322"]
    environment:
      KNOWLEDGE_DIR: /knowledge
      # demo.sh sets http://kumo-relational:8000 under the kumo profile; with `prediction` alone, a remote NIM.
      KUMO_RELATIONAL_URL: ${KUMO_RELATIONAL_URL:-}
      KUMO_API_KEY: ${KUMO_API_KEY:-} # only for a hosted Kumo endpoint
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://phoenix:6006/v1/traces
      OTEL_RESOURCE_ATTRIBUTES: openinference.project.name=knowledge-foundation
    volumes: [knowledge:/knowledge:ro]
    depends_on:
      kumo-relational: { condition: service_healthy, required: false }

  # amd64 only; about 14 GB to download and 44 GB on disk. It pulls without a login; if nvcr.io
  # denies it, log in (docs/operations.md, Brev VM mode).
  kumo-relational:
    <<: *restart
    profiles: [kumo]
    image: nvcr.io/nim/nvidia/kumo-relational:1.0.1@sha256:d2fedf5583d01932efdb7d91d0bcc31b7ff951fcd516f069c4cd900adb87908f
    gpus: all
    shm_size: 16gb
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 60
      start_period: 180s

  # ---------------------------------------------------------------- Auto Ontology (ontology)
  # Upstream's images, built from .build/auto-ontology, which tools/auto-ontology/prepare.sh
  # writes (demo.sh runs it). Env contract: tools/auto-ontology/README.md. It serves one structured source
  # (AUTO_ONTOLOGY_SOURCE, default retail.sales) and builds its ontology with upstream's own ingestion.
  auto-ontology-db:
    <<: *restart
    profiles: [ontology]
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: auto_ontology
      POSTGRES_PASSWORD: auto_ontology # private network only; the database is never published
      POSTGRES_DB: auto_ontology
    volumes: [auto-ontology-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U auto_ontology -d auto_ontology]
      interval: 5s
      timeout: 5s
      retries: 20

  auto-ontology-migrate:
    profiles: [ontology]
    image: knowledge-foundation/auto-ontology:local
    command: [migrate]
    environment: &auto-ontology-env
      POSTGRES_HOST: auto-ontology-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: auto_ontology
      POSTGRES_PASSWORD: auto_ontology
      POSTGRES_DATABASE: auto_ontology
      INGESTION_SERVICE_URL: http://auto-ontology-ingestion:3002
    depends_on:
      auto-ontology-db: { condition: service_healthy }

  auto-ontology:
    <<: *restart
    profiles: [ontology]
    build: .build/auto-ontology # also migrate's and ingestion's image
    image: knowledge-foundation/auto-ontology:local
    # Every model setting is explicit, or upstream falls back to built-in defaults. Reasoning
    # runs on the inference endpoint (not through Switchyard), embed and rerank on the retriever's.
    environment: &auto-ontology-models
      <<: *auto-ontology-env
      REASONING_ENDPOINT: ${INFERENCE_BASE_URL:-}
      REASONING_API_KEY: ${INFERENCE_API_KEY:-}
      REASONING_MODEL: ${AUTO_ONTOLOGY_REASONING_MODEL:-}
      NON_REASONING_ENDPOINT: ${INFERENCE_BASE_URL:-}
      NON_REASONING_API_KEY: ${INFERENCE_API_KEY:-}
      NON_REASONING_MODEL: ${AUTO_ONTOLOGY_NON_REASONING_MODEL:-}
      EMBED_ENDPOINT: ${RETRIEVER_BASE_URL:-https://integrate.api.nvidia.com/v1}
      EMBED_API_KEY: ${RETRIEVER_API_KEY:-${INFERENCE_API_KEY:-}}
      EMBED_MODEL: ${RETRIEVER_EMBED_MODEL:-nvidia/nemotron-3-embed-1b}
      RERANK_ENDPOINT: ${RETRIEVER_RERANK_URL:-https://ai.api.nvidia.com/v1/retrieval/nvidia/llama-nemotron-rerank-vl-1b-v2/reranking}
      RERANK_API_KEY: ${RETRIEVER_API_KEY:-${INFERENCE_API_KEY:-}}
      RERANK_MODEL: ${RETRIEVER_RERANK_MODEL:-nvidia/llama-nemotron-rerank-vl-1b-v2}
      CONNECTION_STRINGS: duckdb:///knowledge/sources/${AUTO_ONTOLOGY_SOURCE:-retail.sales}/tables.duckdb
    volumes: [knowledge:/knowledge:ro]
    depends_on:
      auto-ontology-migrate: { condition: service_completed_successfully }
      ingest: { condition: service_healthy }

  auto-ontology-ingestion:
    <<: *restart
    profiles: [ontology]
    image: knowledge-foundation/auto-ontology:local
    command: [ingestion_service]
    environment: *auto-ontology-models
    volumes: [knowledge:/knowledge:ro]
    depends_on:
      auto-ontology: { condition: service_healthy }
      auto-ontology-compile: { condition: service_completed_successfully }
    # The image healthcheck probes the backend (:3001); ingestion serves :3002.
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3002/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  auto-ontology-frontend-migrate:
    profiles: [ontology]
    image: knowledge-foundation/auto-ontology-frontend:local
    working_dir: /app/migrate
    command: [sh, prisma/migrate.sh]
    environment: *auto-ontology-env
    depends_on:
      auto-ontology-db: { condition: service_healthy }

  # Upstream answers no question until its semantic layer (the ontology) is compiled, and compiles only
  # with Settings > Semantic Compilation on, which is off on a new database. This turns it on before the
  # ingestion service starts; the service then ingests the catalog and compiles the ontology from it.
  auto-ontology-compile:
    profiles: [ontology]
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      PGHOST: auto-ontology-db
      PGUSER: auto_ontology
      PGPASSWORD: auto_ontology
      PGDATABASE: auto_ontology
    command:
      - psql
      - --no-psqlrc
      - --set=ON_ERROR_STOP=1
      - --command=INSERT INTO frontend.configurations (key, value, updated_at)
        VALUES ('semantic_compilation_enabled', 'true', now())
        ON CONFLICT (key) DO UPDATE SET value = 'true', updated_at = now()
    depends_on:
      auto-ontology-frontend-migrate: { condition: service_completed_successfully }

  # The web UI, never published. The API signs in here for the data viewer's ontology.
  auto-ontology-frontend:
    <<: *restart
    profiles: [ontology]
    build: .build/auto-ontology/frontend # also frontend-migrate's image
    image: knowledge-foundation/auto-ontology-frontend:local
    environment:
      <<: *auto-ontology-env
      PYTHON_API_URL: http://auto-ontology:3001
      APP_URL: http://auto-ontology-frontend:3000
      AUTO_ONTOLOGY_ADMIN_EMAIL: admin@example.com
      AUTO_ONTOLOGY_ADMIN_PASSWORD: ${AUTO_ONTOLOGY_ADMIN_PASSWORD:-}
      AUTH_SECRET: ${AUTO_ONTOLOGY_AUTH_SECRET:-}
    depends_on:
      auto-ontology: { condition: service_healthy }
      auto-ontology-frontend-migrate: { condition: service_completed_successfully }

  auto-ontology-mcp:
    <<: *restart
    profiles: [ontology]
    build: .build/auto-ontology/mcp
    image: knowledge-foundation/auto-ontology-mcp:local
    ports: ["127.0.0.1:3303:3003"]
    environment:
      AUTO_ONTOLOGY_API_URL: http://auto-ontology:3001
      # Safe only because nothing untrusted can reach it: loopback and the Compose network.
      AUTO_ONTOLOGY_MCP_TRUSTED_SERVICE_MODE: "true"
      AUTO_ONTOLOGY_MCP_HOST: 0.0.0.0
      AUTO_ONTOLOGY_MCP_PORT: "3003"
      AUTO_ONTOLOGY_MCP_CHAT_TIMEOUT_S: "900"
    depends_on:
      auto-ontology: { condition: service_healthy }
      auto-ontology-ingestion: { condition: service_healthy }

volumes:
  knowledge: {}
  api-data: {}
  phoenix-data: {}
  milvus-data: {}
  switchyard-data: {}
  openshell-state: {}
  openshell-client: {}
  parse-cache: {}
  auto-ontology-db: {}
